# Read the Docs configuration file for xpcsjax
# See https://docs.readthedocs.io/en/stable/config-file/v2.html
#
# The Sphinx project lives at docs/source/conf.py (furo theme + myst-parser,
# autodoc/autosummary/napoleon/intersphinx, sphinx-design, sphinx-copybutton,
# sphinx-autodoc-typehints). RTD installs the package together with its [docs]
# extra so autodoc can import xpcsjax and every Sphinx extension resolves.
#
# Divergences from homodyne/.readthedocs.yaml:
#   - Python pinned to 3.12 (xpcsjax requires-python = ">=3.12")
#   - apt_packages add texlive-latex-recommended/-extra for the hardened
#     xelatex preamble in conf.py (unicode-math, enumitem, amssymb).

version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"
  apt_packages:
    # PDF build uses xelatex (conf.py latex_engine="xelatex"). The conf.py LaTeX
    # preamble loads unicode-math, enumitem, amsmath and amssymb: unicode-math.sty
    # and enumitem.sty ship in texlive-latex-extra (which pulls in
    # texlive-latex-recommended -> -base, covering amsmath/amssymb/hyperref).
    # Without these the RTD PDF build aborts with "file `unicode-math.sty' not found".
    - texlive-xetex
    - texlive-latex-recommended
    - texlive-latex-extra
    - texlive-fonts-recommended
    - fonts-dejavu
    - lmodern

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/source/conf.py
  # `make docs` builds locally with -W (warnings-as-errors); RTD is kept lenient
  # because intersphinx/inventory differences in the online build can surface
  # non-actionable warnings (conf.py already tightens nitpick handling).
  fail_on_warning: false

formats:
  - pdf
  - epub

# Submodules (if any)
submodules:
  include: []
  recursive: false
