{% set name = "xpcsjax" %}
{% set version = "0.1.7" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # 0.1.7 is not on PyPI yet (latest released is 0.1.6) -- build from the
  # local repo checkout. Bump this to a pypi url + sha256 once 0.1.7 ships.
  path: ../..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - hatchling
  run:
    # Core (pyproject.toml [project] dependencies)
    - python >=3.12
    - numpy >=2.3
    - scipy >=1.17
    - jax >=0.8.2
    - jaxlib >=0.8.2
    - jaxopt >=0.8.3
    - nlsq >=0.7.6
    - evosax >=0.2.0
    - h5py >=3.15
    # Verified 2026-08-10: conda-forge's h5py free-threaded (python3.14t)
    # build still links hdf5 2.1.0, but an unconstrained solve happily pairs
    # it with the newly-released hdf5 2.2.0 package -> h5py's own
    # "running against HDF5 2.2.0 when it was built against 2.1.0" warning.
    # Cap the ceiling until conda-forge finishes the hdf5 2.2.0 migration for
    # every h5py build variant; drop this pin once that lands upstream.
    - hdf5 >=2.1,<2.2
    - pyyaml >=6.0.3
    - psutil >=7.2
    - tqdm >=4.67.1
    - matplotlib-base >=3.10
    - pillow >=12.3.0
    - datashader >=0.16
    - xarray >=2024.0
    - colorcet >=3.1
    # [dev] extra -- test/lint/release tooling
    - pytest >=9.0.2
    - pytest-cov >=7.0
    - pytest-env >=1.1
    # pytest-mpl: latest on conda-forge is 0.9 (relaxed from >=0.17 for conda)
    - pytest-mpl >=0.9
    - pytest-xdist >=3.8
    - pytest-benchmark >=5.2
    - pytest-timeout >=2.4
    - hypothesis >=6
    - numba >=0.60
    # ruff: latest on conda-forge is 0.9.9 (relaxed from >=0.15.2 for conda)
    - ruff >=0.9.9
    - mypy >=1.19.1
    # types-pyyaml: conda-forge uses PEP 440-plain versions (6.0.9); PyPI's
    # date-suffixed scheme (6.0.12.20250915) has no conda-forge equivalent yet
    - types-pyyaml >=6.0.9
    - pip-audit >=2.7
    - pre-commit >=4.0
    - python-build >=1.2
    - twine >=5.0
    - setuptools >=83.0.0
    # [docs] extra
    - sphinx >=8.0
    - furo >=2024.8.6
    - sphinx-copybutton >=0.5.2
    - sphinx-autodoc-typehints >=2.5
    - sphinx-design >=0.6
    - myst-parser >=4.0
    - mistune >=3.3.0
    # [gui] extra
    - pyside6 >=6.7
    - pyqtgraph >=0.13
    - pytest-qt >=4.4
    # [packaging] extra
    - pyinstaller >=6.0

test:
  imports:
    - xpcsjax
  commands:
    # `pip check` is omitted: xpcsjax depends on nlsq, and nlsq's own
    # dist-info METADATA has an upstream bug (dev/docs/GUI extras listed as
    # unconditional Requires-Dist with no extra marker -- still present as of
    # nlsq 0.7.6, see conda-recipe/nlsq/meta.yaml). `pip check` fails
    # transitively on nlsq's absent dev tools regardless of anything in this
    # recipe.
    - xpcsjax --help
  requires:
    - pip

about:
  home: https://github.com/imewei/xpcsjax
  summary: Unified JAX-native XPCS NLSQ fitting (homodyne + heterodyne)
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - imewei
  # `run:` bundles pyproject.toml's core dependencies plus every optional
  # extra (dev, docs, gui, packaging -- i.e. the `xpcsjax[all]` pip target),
  # not just the core-required set, so `mamba install xpcsjax` matches
  # `pip install xpcsjax[all]`. Three floors were relaxed below their PyPI
  # pyproject.toml value because conda-forge's mirror lags upstream (see
  # inline comments on pytest-mpl, ruff, types-pyyaml above).
