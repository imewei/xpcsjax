{% set name = "xpcsjax" %}
{% set version = "0.1.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # 0.1.2 is not on PyPI yet (latest released is 0.1.1) -- build from the
  # local repo checkout. Bump this to a pypi url + sha256 once 0.1.2 ships.
  path: ../..

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.12
    - pip
    - hatchling
  run:
    - python >=3.12
    - numpy >=2.3
    - scipy >=1.17
    - jax >=0.8.2
    - jaxlib >=0.8.2
    - jaxopt >=0.8.3
    - nlsq >=0.6.10
    - evosax >=0.2.0
    - h5py >=3.15
    - pyyaml >=6.0.3
    - psutil >=7.2
    - tqdm >=4.67.1
    - matplotlib-base >=3.10
    - pillow >=12.3.0
    - datashader >=0.16
    - xarray >=2024.0
    - colorcet >=3.1

test:
  imports:
    - xpcsjax
  commands:
    # `pip check` is omitted: xpcsjax depends on nlsq, and nlsq 0.7.0's own
    # dist-info METADATA has an upstream bug (dev/docs/GUI extras listed as
    # unconditional Requires-Dist -- fixed at
    # https://github.com/imewei/NLSQ/commit/cbf9dd4, not yet released to
    # PyPI). `pip check` fails transitively on nlsq's absent dev tools
    # regardless of anything in this recipe; see conda-recipe/nlsq/meta.yaml.
    - xpcsjax --help
  requires:
    - pip

about:
  home: https://github.com/imewei/xpcsjax
  summary: Unified JAX-native XPCS NLSQ fitting (homodyne + heterodyne)
  license: MIT
  license_family: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - imewei
