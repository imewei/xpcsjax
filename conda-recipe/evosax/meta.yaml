{% set name = "evosax" %}
{% set version = "0.2.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/evosax-{{ version }}.tar.gz
  sha256: 7fefc9be3ea3f18a8346bd473a34d722723644a6096609b6ec9030e9fa4ebdd6

build:
  number: 0
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python >=3.10
    - pip
    - setuptools >=61
    - wheel
  run:
    - python >=3.10
    - numpy >=1.25
    - jax >=0.5.0
    - flax >=0.10.0
    - dotmap
    - matplotlib-base

test:
  imports:
    - evosax
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/RobertTLange/evosax
  summary: Evolution Strategies in JAX
  license: Apache-2.0
  license_family: APACHE
  # evosax 0.2.0's sdist ships no LICENSE file (verified: absent from the
  # tarball); license_file omitted rather than pointed at a path that
  # doesn't exist.

extra:
  recipe-maintainers:
    - imewei
