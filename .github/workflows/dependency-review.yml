name: Dependency Review
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  dependency-review:
    name: Review dependency changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
      - name: Dependency review
        # Flags a PR that introduces a dependency with a known high+ severity
        # advisory. Complements the runtime `pip-audit` step in ci.yml by
        # auditing at the diff level.
        #
        # This needs the repo's Dependency Graph, which is OFF by default for
        # private repos (Settings -> Code security -> Dependency graph). Until
        # that is enabled the action's compare API returns 403, so we run in
        # `warn-only` mode: it degrades to a warning instead of failing every
        # PR. Once Dependency Graph is enabled, drop `warn-only` to restore a
        # hard high-severity gate. (The previously-passed `dependency-files`
        # input is not supported by this action and was silently ignored.)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # v5.0.0
        with:
          fail-on-severity: high
          warn-only: true
