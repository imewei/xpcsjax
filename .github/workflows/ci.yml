name: CI
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs ONLY on pull_request pushes (where a force-push
# always invalidates the prior run). On main-push, keep all runs to completion
# so a transient runner-cancellation cannot silently mark the run as failed
# for code that already passed in a previous job.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Platform-independent checks run once (fast) and gate the expensive matrix.
  lint:
    name: Lint, types, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
      - name: Sync deps
        run: uv sync --extra dev
      - name: Export locked requirements for audit
        # uv run pip-audit by itself audits the active venv; exporting first
        # makes the audited set explicit and lets pip-audit cross-reference
        # against the uv.lock-pinned versions rather than any installed state.
        run: uv export --format requirements-txt --no-hashes -o requirements-audit.txt
      - name: Dependency vulnerability scan
        run: uv run pip-audit --requirement requirements-audit.txt --desc
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy xpcsjax

  test:
    name: Test (${{ matrix.os }}, py${{ matrix.python-version }})
    needs: lint
    runs-on: ${{ matrix.os }}
    # Per-job hard cap. GitHub-hosted runners default to 360 min; observed
    # matrix-job durations range 23-41 min on a healthy run, so 120 leaves
    # headroom for the runner-cancel retry below (~2x worst-case healthy run).
    # An explicit cap turns any GitHub-side cancellation into a deterministic
    # timeout instead of an opaque "The operation was canceled." with no test
    # outcome.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b  # v8.1.0
        with:
          enable-cache: true
      - name: Install Qt system libraries (headless PySide6, Linux only)
        # PySide6 (pulled in via the pytest-qt plugin) links libEGL/libGL at
        # import time, which the bare ubuntu runner lacks -> pytest aborts with
        # `ImportError: libEGL.so.1`. The minimal runtime set lets Qt run under
        # the offscreen platform (QT_QPA_PLATFORM below). macOS and Windows
        # runners ship the system GL stack and the PySide6 wheels bundle Qt, so
        # no equivalent install is needed there.
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libdbus-1-3
      - name: Sync deps
        id: install
        # py3.14 is informational ONLY here, at install: jax/PySide6 wheels
        # may not yet exist for a freshly-released interpreter, and a source
        # build isn't attempted (see below), so `uv sync` can legitimately
        # fail on 3.14 alone. Scoped to this one step (not the whole job) so
        # a REAL test failure or runner cancellation later in the job is
        # never masked by it -- that was the bug in the old job-level
        # `continue-on-error`, which hid actual CI infra cancellations behind
        # "informational, don't worry about it" for 3.14 specifically. Drop
        # this scoping and the 3.14 matrix entry once 3.14 is a supported
        # target with real wheels.
        continue-on-error: ${{ matrix.python-version == '3.14' }}
        run: uv sync --extra dev --python ${{ matrix.python-version }}
      - name: Test
        id: test
        # Skip testing entirely when install failed on 3.14 (missing
        # wheels) rather than running pytest against a broken/incomplete
        # venv and turning a clean "wheels not published yet" signal into a
        # confusing raft of ImportErrors. For 3.12/3.13, install has no
        # continue-on-error, so a real install failure already halts the
        # job before this step is reached -- this condition only changes
        # behavior for 3.14.
        if: steps.install.outcome == 'success'
        env:
          JAX_ENABLE_X64: "1"
          QT_QPA_PLATFORM: offscreen
          # NOTE: do NOT set XPCSJAX_RUN_CHARACTERIZATION here. That gate runs a
          # LIVE fit against the upstream `homodyne` package using datasets at
          # maintainer-local absolute paths (/home/.../Projects/data/...), so it
          # only runs on a maintainer machine and self-skips in CI by design.
          # The portable heterodyne parity + cross-mode suites run unconditionally.
        # -n 2 (not -n auto): GitHub-hosted ubuntu-latest/windows-latest are
        # 2-core standard runners (macos-latest gets 3-4 -- -n auto would let
        # it use more workers than the other two, adding cross-OS variance).
        # A fixed, uniform cap keeps behavior predictable across the matrix.
        # Was serial (bare `pytest -v`) previously, taking 80-90 min on
        # ubuntu/py3.14 vs the 23-41 min norm cited above -- every extra
        # minute is more exposure to GitHub's runner-pool cancellation
        # window (see the Retry step below), so cutting wall-clock time is a
        # real mitigation, not just a speedup. The per-fit memory budget
        # (xpcsjax/optimization/nlsq/memory.py) already reads
        # PYTEST_XDIST_WORKER_COUNT (set automatically by xdist) and divides
        # accordingly, so this is a supported execution mode, not new
        # territory -- `make verify`/`make test-smoke` already run `-n auto`
        # locally.
        #
        # The two --deselect'd nodes below MUST mirror Makefile's HEAVY_NODES
        # exactly (update both together) -- they are individually slow/flaky
        # under xdist (shared file with cheap tests, so the whole file can't
        # be --ignore'd) and are deselected from every LOCAL parallel pass
        # too, run serially afterward via `make test-heavy-serial`. CI's
        # previous bare `pytest -v` never hit this because it never used
        # xdist; naively adding `-n 2` without mirroring the same exclusion
        # would put these OOM/flake-risky nodes under parallel execution for
        # the first time. Explicit `shell: bash` -- GitHub Actions defaults
        # windows-latest `run:` steps to pwsh, which parses this step's `\`
        # line-continuations as literal characters, not continuations
        # (pwsh uses a backtick), and then chokes on the next line starting
        # with `--deselect` ("Missing expression after unary operator '--'").
        # Git for Windows ships bash on windows-latest runners specifically
        # for this. bash's default `-e` (GitHub Actions bash steps run
        # `bash -eo pipefail`) means the second command only runs if the
        # first succeeds, preserving fail-fast on a real failure.
        shell: bash
        run: |
          uv run pytest -v -n 2 \
            --deselect "tests/optimization/test_heterodyne_joint_escapes.py::test_individual_cmaes_escape_returns_scaling_first" \
            --deselect "tests/gui/test_worker_handle.py::test_handle_synthesizes_died_on_abnormal_exit"
          uv run pytest -v -p no:xdist \
            "tests/optimization/test_heterodyne_joint_escapes.py::test_individual_cmaes_escape_returns_scaling_first" \
            "tests/gui/test_worker_handle.py::test_handle_synthesizes_died_on_abnormal_exit"
      # Retry the entire Test step once if the runner-side cancellation was
      # the cause. CI infra occasionally cancels jobs in-flight with no test
      # failure (e.g. host rebalance, runner-pool churn) — observed on
      # commit c8aba82 where 4 of 9 matrix jobs were externally cancelled
      # mid-test with all assertions passing. Re-running on `cancelled` only
      # is conservative: real test failures still fail-fast. This (and the
      # separate ci-retry-on-runner-cancel.yml workflow) now applies to
      # every matrix cell including 3.14 -- a 3.14 cancellation during Test
      # is a real infra event, not something the install-time
      # `continue-on-error` above should absorb.
      - name: Retry Test on runner-cancel flake
        if: steps.test.conclusion == 'cancelled'
        env:
          JAX_ENABLE_X64: "1"
          QT_QPA_PLATFORM: offscreen
        # Same two-pass split as the Test step above (deselect HEAVY_NODES
        # from the parallel pass, run them serially after) -- must stay in
        # sync with it and with Makefile's HEAVY_NODES. Explicit `shell: bash`
        # for the same reason as the Test step above (windows-latest
        # defaults to pwsh, which can't parse this step's `\` continuations).
        shell: bash
        run: |
          uv run pytest -v -n 2 \
            --deselect "tests/optimization/test_heterodyne_joint_escapes.py::test_individual_cmaes_escape_returns_scaling_first" \
            --deselect "tests/gui/test_worker_handle.py::test_handle_synthesizes_died_on_abnormal_exit"
          uv run pytest -v -p no:xdist \
            "tests/optimization/test_heterodyne_joint_escapes.py::test_individual_cmaes_escape_returns_scaling_first" \
            "tests/gui/test_worker_handle.py::test_handle_synthesizes_died_on_abnormal_exit"
