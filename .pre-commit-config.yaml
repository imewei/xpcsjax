# Pre-commit hooks for xpcsjax
# Install:      uv run pre-commit install
# Run manually: uv run pre-commit run --all-files
#
# Derived from homodyne/.pre-commit-config.yaml. Divergences:
#   - Python pinned to 3.12 (xpcsjax requires-python = ">=3.12")
#   - mypy additional_dependencies tuned for xpcsjax: arviz dropped
#     (Bayesian/CMC is permanently out of scope), evosax/interpax/jaxopt
#     added (xpcsjax-specific deps), and homodyne's web/CLI stubs
#     (types-requests/Pygments/colorama/decorator/setuptools) dropped —
#     xpcsjax imports none of those modules.
#   - results exclusion changed to xpcsjax_results/.

repos:
  # Basic file checks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-case-conflict
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: ^(graphify-out/|tests/characterization/fixtures/)
      - id: debug-statements
      - id: mixed-line-ending
        args: [--fix=lf]

  # Python linting and formatting (ruff replaces flake8, isort, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.5
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format

  # Security scanning
  # Reads the [tool.bandit] section in pyproject.toml (via `-c pyproject.toml`),
  # which sets exclude_dirs and the B101/B110/B403/B404/B603 skip list.
  - repo: https://github.com/PyCQA/bandit
    rev: 1.9.4
    hooks:
      - id: bandit
        args: [-c, pyproject.toml]
        additional_dependencies: ["bandit[toml]"]
        exclude: ^tests/

  # Type checking
  # Pre-commit runs mypy in an isolated venv (does NOT see uv.lock), unlike
  # CI's `uv run mypy xpcsjax` which checks against the full locked venv. The
  # [tool.mypy] config sets ignore_missing_imports=true, so an unlisted package
  # won't raise a missing-import error — but listing the import-resolvable
  # packages xpcsjax/ imports lets this isolated run resolve their inline types
  # the same way CI does, keeping the two mypy passes in agreement.
  - repo: https://github.com/pre-commit/mirrors-mypy
    # Pinned to match the mypy version uv.lock resolves (CI runs `uv run mypy`).
    # A stale rev here (older mypy) diverges from CI: e.g. mypy 1.19 flagged a
    # dict.get(...) chain that 2.1 infers cleanly. Bump in lockstep with uv.lock.
    rev: v2.1.0
    hooks:
      - id: mypy
        # Mirror the CI type gate exactly: `uv run mypy xpcsjax` (ci.yml "Type
        # check"). Run in package mode against the xpcsjax/ target with
        # pass_filenames: false, NOT per-changed-file — so the hook and CI
        # analyze the same import graph and agree. Per-file invocation diverges
        # (different inference, and it would also pull in scripts/, which is
        # outside the type contract).
        pass_filenames: false
        args: [xpcsjax, --config-file=pyproject.toml]
        additional_dependencies:
          # Type stubs for the third-party libs xpcsjax actually imports.
          - types-psutil>=7.2
          - types-pyyaml>=6.0
          # Real packages so mypy resolves their (inline) types at import time.
          # Lower bounds mirror the [project] dependencies in pyproject.toml.
          - numpy>=2.3
          - scipy>=1.17
          - jax>=0.8.2
          - jaxopt>=0.8.3
          - interpax>=0.3.12
          - nlsq>=0.6.10
          - evosax>=0.2.0
          - scikit-learn>=1.6
          - matplotlib>=3.10

  # Markdown formatting
  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0
    hooks:
      - id: mdformat
        args: [--wrap=88]
        exclude: ^(README\.md|docs/superpowers/.*\.md)$

  # YAML/JSON formatting
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types_or: [yaml, json]
        args: [--write, --tab-width=2]

  # Jupyter notebook linting
  - repo: https://github.com/nbQA-dev/nbQA
    rev: 1.9.1
    hooks:
      - id: nbqa-ruff
        args: [--ignore=E402, --ignore=B905]
        additional_dependencies: [ruff>=0.15.5]

default_language_version:
  python: python3.12

exclude: |
  (?x)^(
      \.eggs/|
      \.git/|
      \.mypy_cache/|
      \.pytest_cache/|
      \.ruff_cache/|
      \.tox/|
      \.venv/|
      _build/|
      build/|
      dist/|
      venv/|
      .*\.egg-info/|
      xpcsjax_results/|
      \.benchmarks/|
      bandit_report\.json|
      coverage\.xml|
      htmlcov/
  )$
